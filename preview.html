function applyToon(root) {
  root.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true; o.receiveShadow = true;
      // 关键：如果原 GLB 材质有 map 纹理（baseColorTexture），保留纹理，toon 只是改 shading
      // 否则才走顶点色 / 默认色逻辑
      const origMat = o.material;
      const hasMap = origMat && (origMat.map ||
        (origMat.pbrMetallicRoughness && origMat.pbrMetallicRoughness.baseColorTexture &&
         origMat.pbrMetallicRoughness.baseColorTexture.index !== undefined && origMat.pbrMetallicRoughness.baseColorTexture.index !== null &&
         (origMat.pbrMetallicRoughness.baseColorTexture.source !== undefined || origMat.pbrMetallicRoughness.baseColorTexture.texture !== undefined)));
      if (hasMap) {
        // 保留贴图，用 toon 渲染：把原 map 复制到 MeshToonMaterial.map
        const map = origMat.map || (origMat.pbrMetallicRoughness && origMat.pbrMetallicRoughness.baseColorTexture);
        o.material = new THREE.MeshToonMaterial({
          color: 0xffffff,
          map: map,
          gradientMap,
        });
        return;
      }
      const attr = o.geometry && o.geometry.attributes.color;
      const hasVertexColors = !!(attr && attr.itemSize >= 3);
      let baseColorHex = 0xcccccc;
      if (hasVertexColors) {
        const a = attr.array;
        baseColorHex = (a[0] << 16) | (a[1] << 8) | a[2];
      } else if (origMat && origMat.color && !Array.isArray(origMat)) {
        const h = origMat.color.getHex();
        if (h !== 0xffffff) baseColorHex = h;
      }
      o.material = new THREE.MeshToonMaterial({
        color: baseColorHex,
        gradientMap,
        vertexColors: false
      });
    }
  });
}

function placeGround(model, x, z, ry=0) {
  model.rotation.y = ry;
  const box = new THREE.Box3().setFromObject(model);
  model.position.y = -box.min.y;
  model.position.x = x;
  model.position.z = z;
  scene.add(model);
}

function loadAsset(entry, x, z, ry=0) {
  return new Promise((resolve) => {
    loader.load('./' + entry.path, (gltf) => {
      applyToon(gltf.scene);
      const group = new THREE.Group();
      group.add(gltf.scene);
      placeGround(group, x, z, ry);
      loadedModels.set(entry.assetId, group);
      // 注册门交互：门板部件（plank/rail/handle）挂到 pivot 绕铰链旋转
      if (entry.interactions && entry.interactions.doors) {
        entry.interactions.doors.forEach((doorCfg) => {
          const prefix = doorCfg.name;
          const moving = [];
          gltf.scene.traverse(o => {
            if (!o.isMesh || !o.name.startsWith(prefix)) return;
            if (/plank|rail|handle/.test(o.name)) moving.push(o);
          });
          if (moving.length > 0) {
            const pivot = setupDoorPivot(gltf.scene, moving, doorCfg.hinge || 'left');
            const key = entry.assetId + ':' + prefix;
            doorRegistry.set(key, { group, parts: moving, pivot, cfg: doorCfg, open: false });
          }
        });
      }
      resolve(group);
    }, undefined, (err) => {
      console.warn('FAIL', entry.assetId, err);
      resolve(null);
    });
  });
}

function loadInteriorFurniture() {
  // 农舍所在位置与旋转
  const farmhouse = loadedModels.get('building_farmhouse');
  if (!farmhouse) return;
  const baseX = -6, baseZ = -4, baseRy = Math.PI/2;
  INTERIOR_FURNITURE.forEach(([fid, fx, fz, fry]) => {
    const entry = MANIFEST.assets.find(a => a.assetId === fid);
    if (!entry) return;
    loader.load('./' + entry.path, (gltf) => {
      applyToon(gltf.scene);
      // 计算相对农舍旋转后的偏移
      const cs = Math.cos(baseRy), sn = Math.sin(baseRy);
      const wx = baseX + (fx * cs + fz * sn);
      const wz = baseZ + (-fx * sn + fz * cs);
      const box = new THREE.Box3().setFromObject(gltf.scene);
      gltf.scene.position.y = -box.min.y;
      gltf.scene.position.x = wx;
      gltf.scene.position.z = wz;
      gltf.scene.rotation.y = baseRy + fry;
      scene.add(gltf.scene);
      loadedModels.set(fid + '_interior', gltf.scene);
    });
  });
}

// 门开关：点击门面板切换（门板=plank/rail/handle 可动部件，门框固定）
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const doorObjects = [];

function setupDoorPivot(sceneRoot, parts, hingeSide) {
  // 创建 pivot 并放到铰链轴位置，然后把门板部件 attach（保持世界变换）
  const pivot = new THREE.Group();
  const box = new THREE.Box3();
  parts.forEach(p => box.expandByObject(p));
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const hingeX = hingeSide === 'right' ? center.x + size.x / 2 : center.x - size.x / 2;
  pivot.position.set(hingeX, center.y, center.z);
  sceneRoot.add(pivot);
  parts.forEach(p => pivot.attach(p));
  return pivot;
}

function collectDoorMeshes() {
  doorObjects.length = 0;
  doorRegistry.forEach((rec, key) => {
    if (rec.parts && rec.parts.length > 0) {
      rec.parts.forEach(p => doorObjects.push({ mesh: p, rec, key }));
    }
  });
}

function onPointerDown(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = doorObjects.map(d => d.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    const hit = doorObjects.find(d => d.mesh === hits[0].object);
    if (hit) toggleDoor(hit.key);
  }
}

function toggleDoor(key) {
  const rec = doorRegistry.get(key);
  if (!rec || !rec.pivot) return;
  rec.open = !rec.open;
  const angle = rec.open ? THREE.MathUtils.degToRad(rec.cfg.angle || 110) : 0;
  const sign = rec.cfg.hinge === 'right' ? -1 : 1;
  rec.pivot.rotation.y = angle * sign;
  infoEl.textContent = `门: ${rec.open ? '开' : '关'} (${rec.key})`;
  collectDoorMeshes();
}

let currentCategory = 'all';
function updateVisibility() {
  loadedModels.forEach((model, assetId) => {
    const entry = MANIFEST.assets.find(a => a.assetId === assetId);
    if (!entry) return;
    const show = currentCategory === 'all' || entry.category === currentCategory;
    model.visible = show;
  });
  const total = MANIFEST.assets.length;
  const loaded = loadedModels.size;
  statsEl.innerHTML = `已加载 <b style="color:#FFD166">${loaded}/${total}</b> 个资产<br>🖱 点击建筑的门可开合`;
}

async function init() {
  infoEl.textContent = '正在加载资产...';
  const tasks = LAYOUT.map(([x, z, ry, id]) => {
    const entry = MANIFEST.assets.find(a => a.assetId === id);
    return entry ? loadAsset(entry, x, z, ry) : Promise.resolve(null);
  });
  await Promise.all(tasks);
  loadInteriorFurniture();
  collectDoorMeshes();
  infoEl.textContent = `✔ 完成 ${loadedModels.size} 个资产就位 · 点击门可开关`;
  updateVisibility();
}

catSel.addEventListener('change', () => {
  currentCategory = catSel.value;
  updateVisibility();
  const label = catSel.options[catSel.selectedIndex].textContent;
  infoEl.textContent = `筛选: ${label}`;
});

renderer.domElement.addEventListener('pointerdown', onPointerDown);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
