<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>混元 3D 鸭子（HY3 真 3D 模型 + 分离式脚）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#1a2332; color:#eee; overflow:hidden; }
  #viewer { position:absolute; inset:0; }
  #panel { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(20,28,40,.85);
    border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:10px 18px; display:flex; gap:12px; align-items:center; z-index:10; }
  .btn { background:#2b3a52; color:#dfe9f5; border:1px solid #3d5068; padding:7px 16px; border-radius:8px; font-size:13px; cursor:pointer; }
  .btn.active { background:#4a9de0; border-color:#6cb8f0; color:#fff; }
  #status { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(20,28,40,.8);
    border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px 16px; font-size:13px; color:#b8c8dc; z-index:10; text-align:center; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="panel">
  <button class="btn" id="btnWalk">🦆 走路</button>
  <button class="btn" id="btnEat">🐛 低头吃食</button>
  <button class="btn" id="btnIdle" class="active">🧍 待机</button>
</div>
<div id="status">加载中...</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.5, 1.6, 3.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xDFEBFF, 0xFFF0D0, 2.2));
const sun = new THREE.DirectionalLight(0xFFF8E8, 2.8);
sun.position.set(5, 8, 4); sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xCFE8FF, 1.0);
fill.position.set(-4, 3, -2);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(5, 32),
  new THREE.MeshLambertMaterial({ color: 0x8BC34A })
);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
const statusEl = document.getElementById('status');
let duck = null, pivot = null, body = null;
let mode = 'idle', time = 0;

// ============ 低头动作：以脚为圆心的枢轴旋转（标准方法） ============
// 方法说明：把鸭子放进一个 pivot Group，pivot 原点 = 鸭子脚底。
// 低头 = pivot.rotation.x 从 0 平滑插值到目标角度（绕脚底前倾，看起来像弯腰低头）。
// 这样「脚着地不动，身体绕脚转动」就是真实弯腰，而不是整体位移。
async function init() {
  try {
    // 直接加载混元 3D 鸭子（保留 PBR baseColorTexture 颜色：黄嘴/黑眼/白身）
    const gltf = await loader.loadAsync('hy3_duck_body.glb');
    duck = gltf.scene;
    duck.scale.setScalar(1.2);
    // 让 PBR 材质转换为 Lambert 柔和（保留 map 颜色）
    duck.traverse(o => {
      if (o.isMesh) {
        o.castShadow = o.receiveShadow = true;
        if (o.material) {
          // 保留 baseColorTexture 颜色（黄嘴/黑眼/白身），Lambert 光照柔和
          o.material = new THREE.MeshLambertMaterial({
            color: 0xffffff,
            map: o.material.map || (o.material.pbrMetallicRoughness && o.material.pbrMetallicRoughness.baseColorTexture) || null,
          });
        }
      }
    });
    // pivot 组：原点 = 鸭子脚底（混元模型 bounds min_y = 0）
    pivot = new THREE.Group();
    pivot.position.set(0, 0, 0);
    scene.add(pivot);
    pivot.add(duck);  // 鸭子作为 pivot 子节点 → 绕脚底旋转
    body = duck;
    statusEl.textContent = '✅ 混元 3D 鸭子就绪（HY3 AI 真 3D 模型，保留 PBR 颜色：黄嘴+黑眼+白身）';
    console.log('body:', !!body, 'pivot:', !!pivot);
  } catch (e) {
    statusEl.textContent = '❌ ' + e.message;
    console.error(e);
  }
}

function setMode(m) {
  mode = m; time = 0;
  document.querySelectorAll('#panel .btn').forEach(b => b.classList.remove('active'));
  document.getElementById(m === 'walk' ? 'btnWalk' : m === 'eat' ? 'btnEat' : 'btnIdle').classList.add('active');
}

// 平滑插值（lerp）：让动作"动起来"而不是瞬间切换
const lerp = (a, b, t) => a + (b - a) * t;

function animateDuck(dt) {
  if (!duck || !pivot) return;
  if (mode === 'walk') {
    // 走路：鸭子上下浮动 + 微侧摆（pivot 保持直立）
    pivot.rotation.x = lerp(pivot.rotation.x, 0, 0.1);
    duck.position.y = Math.abs(Math.sin(time * 6)) * 0.06;
    duck.rotation.z = Math.sin(time * 6) * 0.05;
  } else if (mode === 'eat') {
    // 低头吃食：以脚底为圆心，身体绕 pivot 平滑前倾（动态动作）
    duck.position.y = lerp(duck.position.y, 0, 0.1);
    duck.rotation.z = lerp(duck.rotation.z, 0, 0.1);
    pivot.rotation.x = lerp(pivot.rotation.x, 0.7, 0.08);  // 平滑转到 40° 低头
    // 低头到位后微微点头（更有生命力）
    if (pivot.rotation.x > 0.6) {
      pivot.rotation.x += Math.sin(time * 4) * 0.01;
    }
  } else {
    // 待机：平滑回到直立
    pivot.rotation.x = lerp(pivot.rotation.x, 0, 0.1);
    duck.position.y = lerp(duck.position.y, 0, 0.1);
    duck.rotation.z = lerp(duck.rotation.z, 0, 0.1);
  }
}

let lastT = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; time += dt;
  animateDuck(dt);
  controls.update();
  // 调试钩子：记录 pivot 旋转角度（验证低头是动画）
  window.__pivotRotX = pivot ? pivot.rotation.x : -1;

  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

document.getElementById('btnWalk').onclick = () => setMode('walk');
document.getElementById('btnEat').onclick = () => setMode('eat');
document.getElementById('btnIdle').onclick = () => setMode('idle');
init();
</script>
</body>
</html>
