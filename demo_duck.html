<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>混元 3D 鸭子（HY3 真 3D 模型 + 分离式脚）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#1a2332; color:#eee; overflow:hidden; }
  #viewer { position:absolute; inset:0; }
  #panel { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(20,28,40,.85);
    border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:10px 18px; display:flex; gap:12px; align-items:center; z-index:10; }
  .btn { background:#2b3a52; color:#dfe9f5; border:1px solid #3d5068; padding:7px 16px; border-radius:8px; font-size:13px; cursor:pointer; }
  .btn.active { background:#4a9de0; border-color:#6cb8f0; color:#fff; }
  #status { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(20,28,40,.8);
    border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px 16px; font-size:13px; color:#b8c8dc; z-index:10; text-align:center; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="panel">
  <button class="btn" id="btnWalk">🦆 走路</button>
  <button class="btn" id="btnEat">🐛 低头吃食</button>
  <button class="btn" id="btnIdle" class="active">🧍 待机</button>
</div>
<div id="status">加载中...</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.5, 1.6, 3.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xDFEBFF, 0xFFF0D0, 2.2));
const sun = new THREE.DirectionalLight(0xFFF8E8, 2.8);
sun.position.set(5, 8, 4); sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xCFE8FF, 1.0);
fill.position.set(-4, 3, -2);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(5, 32),
  new THREE.MeshLambertMaterial({ color: 0x8BC34A })
);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
const statusEl = document.getElementById('status');
let duck = null, body = null, footL = null, footR = null;
let mode = 'idle', time = 0;

async function init() {
  try {
    const gltf = await loader.loadAsync('assets/animals/animal_duck_white.glb');
    duck = gltf.scene;
    // 混元模型较大（47MB，90万面），适当缩放展示
    duck.scale.setScalar(1.2);
    duck.traverse(o => {
      if (o.isMesh) {
        o.castShadow = o.receiveShadow = true;
        o.material = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true });
      }
    });
    scene.add(duck);
    body = duck.getObjectByName('body');
    footL = duck.getObjectByName('foot_l');
    footR = duck.getObjectByName('foot_r');
    statusEl.textContent = '✅ 混元 3D 鸭子就绪（HY3 AI 生成身体+脚，分离式组装）— 点击按钮看走路/低头';
    console.log('节点:', body ? 'body✓' : 'body✗', footL ? 'footL✓' : 'footL✗', footR ? 'footR✓' : 'footR✗');
  } catch (e) {
    statusEl.textContent = '❌ ' + e.message;
    console.error(e);
  }
}

function setMode(m) {
  mode = m; time = 0;
  document.querySelectorAll('#panel .btn').forEach(b => b.classList.remove('active'));
  document.getElementById(m === 'walk' ? 'btnWalk' : m === 'eat' ? 'btnEat' : 'btnIdle').classList.add('active');
}

function animateDuck(dt) {
  if (!duck) return;
  if (mode === 'walk') {
    // 走路：双脚交替摆动 + 身体上下微浮
    if (footL) footL.rotation.x = Math.sin(time * 6) * 0.35;
    if (footR) footR.rotation.x = -Math.sin(time * 6) * 0.35;
    if (body) body.position.y = Math.abs(Math.sin(time * 6)) * 0.03;
  } else if (mode === 'eat') {
    // 低头吃食：身体整体前倾（鸭嘴到地）
    if (footL) footL.rotation.x = 0;
    if (footR) footR.rotation.x = 0;
    if (body) { body.rotation.x = 0.6; body.position.y = 0; }
  } else {
    // 待机
    if (footL) footL.rotation.x = 0;
    if (footR) footR.rotation.x = 0;
    if (body) { body.rotation.x = 0; body.position.y = 0; }
  }
}

let lastT = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; time += dt;
  animateDuck(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

document.getElementById('btnWalk').onclick = () => setMode('walk');
document.getElementById('btnEat').onclick = () => setMode('eat');
document.getElementById('btnIdle').onclick = () => setMode('idle');
init();
</script>
</body>
</html>
