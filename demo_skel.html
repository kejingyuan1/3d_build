<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>鸭子真骨骼动画（HY3D 混元 + 程序化绑骨 v2）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#1a2332; color:#eee; overflow:hidden; }
  #viewer { position:absolute; inset:0; }
  #panel { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(20,28,40,.85);
    border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:10px 18px; display:flex; gap:12px; align-items:center; z-index:10; }
  .btn { background:#2b3a52; color:#dfe9f5; border:1px solid #3d5068; padding:7px 16px; border-radius:8px; font-size:13px; cursor:pointer; }
  .btn.active { background:#4a9de0; border-color:#6cb8f0; color:#fff; }
  #status { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(20,28,40,.8);
    border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px 16px; font-size:13px; color:#b8c8dc; z-index:10; text-align:center; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="panel">
  <button class="btn" id="btnWalk">🦆 走路（骨骼）</button>
  <button class="btn" id="btnEat">🐛 低头吃食（骨骼）</button>
  <button class="btn" id="btnIdle" class="active">🧍 待机</button>
</div>
<div id="status">加载中...</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.5, 1.6, 3.5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
viewer.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xDFEBFF, 0xFFF0D0, 2.2));
const sun = new THREE.DirectionalLight(0xFFF8E8, 2.8);
sun.position.set(5, 8, 4); sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xCFE8FF, 1.0);
fill.position.set(-4, 3, -2);
scene.add(fill);

const ground = new THREE.Mesh(new THREE.CircleGeometry(5, 32), new THREE.MeshLambertMaterial({ color: 0x8BC34A }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
const statusEl = document.getElementById('status');
let duck = null, mixer = null, actions = {}, skinnedMesh = null, bones = [];
let mode = 'idle', time = 0;

async function init() {
  try {
    // 加载绑骨版 GLB（网格站立姿态 + skin + animations）
    const gltf = await loader.loadAsync('hy3_duck_skel.glb');
    duck = gltf.scene;
    duck.scale.setScalar(1.2);
    duck.traverse(o => {
      if (o.isMesh) {
        o.castShadow = o.receiveShadow = true;
        o.material = new THREE.MeshLambertMaterial({
          color: 0xffffff,
          map: o.material && (o.material.map || (o.material.pbrMetallicRoughness && o.material.pbrMetallicRoughness.baseColorTexture)) || null,
        });
      }
    });
    scene.add(duck);
    // 找 SkinnedMesh 和骨骼（直接用 Three.js API 驱动 bones，绕开 glTF animation channel）
    duck.traverse(o => { if (o.isSkinnedMesh) skinnedMesh = o; });
    if (skinnedMesh) {
      bones = skinnedMesh.skeleton.bones;
      window.__bones = bones; window.__skinned = skinnedMesh; window.__duck = duck;
      console.log('找到骨骼:', bones.map(b => b.name).join(', '));
      statusEl.textContent = '✅ 真骨骼就绪（' + bones.map(b=>b.name).join('/') + '）— 走路=腿摆动，低头=前倾';
    } else {
      statusEl.textContent = '❌ 未找到 SkinnedMesh';
    }
  } catch (e) {
    statusEl.textContent = '❌ ' + e.message;
    console.error(e);
  }
}
function setMode(m) {
  mode = m;
  time = 0;
  document.querySelectorAll('#panel .btn').forEach(b => b.classList.remove('active'));
  document.getElementById(m === 'walk' ? 'btnWalk' : m === 'eat' ? 'btnEat' : 'btnIdle').classList.add('active');
  // bones 初始归位（bind pose）
  if (bones.length) {
    bones.forEach(b => { b.rotation.set(0, 0, 0); });
  }
}
let lastT = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; time += dt;
  // 直接驱动骨骼（绕开 glTF animation channel，用 Three.js API）
  if (bones.length >= 3) {
    const root = bones[0], legL = bones[1], legR = bones[2];
    if (mode === 'walk') {
      // 走路：左/右腿交替左右摆（绕 Y 轴，相机方向明显）
      legL.rotation.y = Math.sin(time * 4) * 0.8;  // 摆幅加大到 0.8rad 让走路明显
      legR.rotation.y = -Math.sin(time * 4) * 0.8;
      root.rotation.x = 0;
    } else if (mode === 'eat') {
      // 低头：root 前倾 0.5rad（约 29°），腿保持
      legL.rotation.x = 0;
      legR.rotation.x = 0;
      root.rotation.x = 0.4;  // eat 稍小避免爆炸
    } else {
      // 待机
      legL.rotation.x = 0;
      legR.rotation.x = 0;
      root.rotation.x = 0;
    }
    // 关键：骨骼 rotation 改变后必须更新 skeleton 的 boneMatrices（否则顶点不变）
    if (skinnedMesh) {
      duck.updateMatrixWorld(true);
      skinnedMesh.skeleton.update();
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.getElementById('btnWalk').onclick = () => setMode('walk');
document.getElementById('btnEat').onclick = () => setMode('eat');
document.getElementById('btnIdle').onclick = () => setMode('idle');
init();
</script>
</body>
</html>
