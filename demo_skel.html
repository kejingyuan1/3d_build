<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>鸭子走路（程序化顶点动画 — 改 vertices 让腿抬起来）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#1a2332; color:#eee; overflow:hidden; }
  #viewer { position:absolute; inset:0; }
  #panel { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(20,28,40,.85);
    border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:10px 18px; display:flex; gap:12px; align-items:center; z-index:10; }
  .btn { background:#2b3a52; color:#dfe9f5; border:1px solid #3d5068; padding:7px 16px; border-radius:8px; font-size:13px; cursor:pointer; }
  .btn.active { background:#4a9de0; border-color:#6cb8f0; color:#fff; }
  #status { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(20,28,40,.8);
    border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px 16px; font-size:13px; color:#b8c8dc; z-index:10; text-align:center; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="panel">
  <button class="btn" id="btnWalk">🦆 走路（腿抬起来）</button>
  <button class="btn" id="btnEat">🐛 低头吃食</button>
  <button class="btn" id="btnIdle" class="active">🧍 待机</button>
</div>
<div id="status">加载中...</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.5, 1.6, 3.5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
viewer.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xDFEBFF, 0xFFF0D0, 2.2));
const sun = new THREE.DirectionalLight(0xFFF8E8, 2.8);
sun.position.set(5, 8, 4); sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xCFE8FF, 1.0);
fill.position.set(-4, 3, -2);
scene.add(fill);

const ground = new THREE.Mesh(new THREE.CircleGeometry(5, 32), new THREE.MeshLambertMaterial({ color: 0x8BC34A }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
const statusEl = document.getElementById('status');
let duck = null, body = null, mesh = null;
let posOri = null, posNow = null;  // 原始 + 当前 vertex positions
let legMask = null, legTopY = 0;
let mode = 'idle', time = 0;

async function init() {
  try {
    // 用最稳定的 hy3_duck_body.glb（混元原图，结构简单可靠）
    const gltf = await loader.loadAsync('hy3_duck_body.glb');
    duck = gltf.scene;
    // wrapper X 旋转 -π/2 让侧躺变站立（混元生成是侧躺姿态）
    const wrapper = new THREE.Group();
    wrapper.rotation.x = -Math.PI / 2;
    scene.add(wrapper);
    wrapper.add(duck);
    duck.scale.setScalar(1.2);
    // 找 mesh，保留 PBR 颜色
    duck.traverse(o => {
      if (o.isMesh) {
        o.castShadow = o.receiveShadow = true;
        o.material = new THREE.MeshLambertMaterial({
          color: 0xffffff,
          map: o.material && (o.material.map || (o.material.pbrMetallicRoughness && o.material.pbrMetallicRoughness.baseColorTexture)) || null,
        });
        mesh = o;
      }
    });
  // 缓存原始 vertices（备用——目前改用 duck.rotation/pivot 动画，不改 vertices）
  posOri = mesh.geometry.attributes.position.array.slice();
  posNow = mesh.geometry.attributes.position.array;
    // 找腿区域：底部 25% 顶点（按 Y 分位）
    const verts = [];
    for (let i = 0; i < posOri.length; i += 3) verts.push(posOri[i+1]);
    verts.sort((a, b) => a - b);
    legTopY = verts[Math.floor(verts.length * 0.25)];
    legMask = new Uint8Array(verts.length);
    for (let i = 0; i < verts.length; i++) {
      legMask[i] = (posOri[i*3+1] < legTopY) ? 1 : 0;
    }
    const legCount = legMask.reduce((a, b) => a+b, 0);
    statusEl.textContent = `✅ 鸭子就绪（腿区域 ${legCount} 顶点可抬腿）— 走路=手动改 vertices 让腿抬起来`;
    console.log('leg region:', legCount, 'vertices, legTopY:', legTopY.toFixed(2));
  } catch (e) {
    statusEl.textContent = '❌ ' + e.message;
    console.error(e);
  }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#panel .btn').forEach(b => b.classList.remove('active'));
  document.getElementById(m === 'walk' ? 'btnWalk' : m === 'eat' ? 'btnEat' : 'btnIdle').classList.add('active');
}

// 状态：mode 控制 wrapper 的 rotation（eat 前倾）+ position（walk 上下浮动）
let walkPhase = 0;
function updateAnimation(dt) {
  if (!duck) return;
  // 找 wrapper（duck 的父节点）
  const wrapper = duck.parent;
  if (!wrapper) return;
  if (mode === 'walk') {
    // 走路：duck 在 wrapper 中上下浮动 + 轻微 Y 旋转（摆动身体）—— 不改 vertices 不爆贴图
    walkPhase += dt * 4;
    duck.position.y = Math.abs(Math.sin(walkPhase)) * 0.05;
    duck.rotation.y = Math.sin(walkPhase) * 0.08;  // 左右摆动
  } else if (mode === 'eat') {
    // 低头：duck 整体前倾（用 duck 自己的 rotation）
    duck.position.y = 0;
    duck.rotation.y = 0;
    duck.rotation.x = 0.5;  // X 轴前倾（前面低头）
  } else {
    // 待机：恢复
    duck.position.y = 0;
    duck.rotation.y = 0;
    duck.rotation.x = 0;
  }
}

let lastT = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; time += dt;
  updateAnimation(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.getElementById('btnWalk').onclick = () => setMode('walk');
document.getElementById('btnEat').onclick = () => setMode('eat');
document.getElementById('btnIdle').onclick = () => setMode('idle');
init();
</script>
</body>
</html>
