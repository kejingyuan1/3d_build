<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海洋地图（轻量版）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#0d1b2a; color:#eee; overflow:hidden; }
  #viewer { position:absolute; inset:0; }
  #status { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(8,20,35,.85);
    border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:8px 18px; font-size:13px; color:#b8c8dc; z-index:10; text-align:center; }
  #legend { position:absolute; right:12px; top:12px; background:rgba(8,20,35,.85); border:1px solid rgba(255,255,255,.15);
    border-radius:10px; padding:12px 16px; font-size:12px; color:#9fb3c8; z-index:10; line-height:2; }
  #legend .t { color:#fff; font-weight:bold; margin-bottom:4px; }
  #legend .sw { display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="legend">
  <div class="t">海洋地图</div>
  <div><span class="sw" style="background:#2E86C1"></span>海面 800×800m（动态波浪）</div>
  <div><span class="sw" style="background:#E8D8A0"></span>16 岛（均匀分布，玩家一人一岛）</div>
  <div><span class="sw" style="background:#C8753A"></span>铜矿 × 小/中/大</div>
  <div><span class="sw" style="background:#D8DCE0"></span>银矿 × 小/中/大</div>
  <div><span class="sw" style="background:#FFD700"></span>金矿 × 小/中/大</div>
  <div style="margin-top:6px;color:#6b7f96">🖱 左键旋转 · 滚轮缩放 · 沙滩白色浪花动</div>
</div>
<div id="status">加载中...</div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const viewer = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
// 不设 fog（地图 800m × 20 设了雾整个场景会模糊）
// scene.fog = new THREE.Fog(0x87CEEB, 250, 1100);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 250, 450);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2 - 0.02;

scene.add(new THREE.HemisphereLight(0xDFEBFF, 0xFFF0D0, 1.8));
const sun = new THREE.DirectionalLight(0xFFF8E8, 2.8);
sun.position.set(10, 20, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -500; sun.shadow.camera.right = 500;
sun.shadow.camera.top = 500; sun.shadow.camera.bottom = -500;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xCFE8FF, 0.8);
fill.position.set(-6, 8, -4);
scene.add(fill);

const loader = new GLTFLoader();
const statusEl = document.getElementById('status');

function makeGradient() {
  // 4 阶：更亮、对比更强（细节清晰）
  const g = new Uint8Array([0xD0,0xD0,0xD0,0xFF, 0xE8,0xE8,0xE8,0xFF, 0xF8,0xF8,0xF8,0xFF, 0xFF,0xFF,0xFF,0xFF]);
  const t = new THREE.DataTexture(g, 4, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; return t;
}

function applyToon(root) {
  root.traverse(o => {
    if (o.isMesh) {
      o.castShadow = o.receiveShadow = true;
      const orig = o.material;
      const attr = o.geometry && o.geometry.attributes.color;
      let hex = 0xcccccc;
      if (attr && attr.array) hex = (attr.array[0]<<16)|(attr.array[1]<<8)|attr.array[2];
      const hasMap = orig && (orig.map || (orig.pbrMetallicRoughness && orig.pbrMetallicRoughness.baseColorTexture));
      o.material = new THREE.MeshToonMaterial({ color:0xffffff, map: hasMap ? (orig.map||orig.pbrMetallicRoughness.baseColorTexture) : null, gradientMap: makeGradient() });
      if (!hasMap) o.material.color.setHex(hex);
    }
  });
}

async function loadGLB(path) {
  const gltf = await loader.loadAsync(path);
  applyToon(gltf.scene);
  return gltf.scene;
}

// 16 岛均匀分布（玩家一人一岛，规格一致，环形 2 圈等间距）
// 外圈 r=350：8 岛（每 45°），内圈 r=200：8 岛（每 45°，错开 22.5°）
const ISLAND_LAYOUT = [
  // 外圈 8 岛
  { id: '01', r: 350, a: 0    }, { id: '02', r: 350, a: 45  },
  { id: '03', r: 350, a: 90   }, { id: '04', r: 350, a: 135 },
  { id: '05', r: 350, a: 180  }, { id: '06', r: 350, a: 225 },
  { id: '07', r: 350, a: 270  }, { id: '08', r: 350, a: 315 },
  // 内圈 8 岛（错开 22.5° 避免重叠）
  { id: '09', r: 200, a: 22.5 }, { id: '10', r: 200, a: 67.5 },
  { id: '11', r: 200, a: 112.5}, { id: '12', r: 200, a: 157.5},
  { id: '13', r: 200, a: 202.5}, { id: '14', r: 200, a: 247.5},
  { id: '15', r: 200, a: 292.5}, { id: '16', r: 200, a: 337.5},
];

// 矿藏：均匀散点分布（每岛附近放 1 个矿，铜/银/金轮换）
const ORE_LAYOUT = [
  { ore: 'copper_small',   pos: [350, 0, 0] },    // 01 附近
  { ore: 'silver_medium',  pos: [0, 0, 350] },    // 03 附近
  { ore: 'gold_large',     pos: [-350, 0, 0] },   // 05 附近
  { ore: 'copper_medium',  pos: [0, 0, -350] },   // 07 附近
  { ore: 'silver_small',   pos: [200, 0, 80] },   // 09 附近
  { ore: 'gold_medium',    pos: [80, 0, -185] },  // 12 附近
  { ore: 'copper_large',   pos: [-185, 0, -80] }, // 14 附近
  { ore: 'silver_large',   pos: [-80, 0, 185] },  // 15 附近
  { ore: 'gold_small',     pos: [120, 0, 120] },  // 中心区域
];

async function init() {
  try {
    // 动态海面：自定义 ShaderMaterial（顶点波浪 + 波光高光 + 浪花渐变）
    const oceanMesh = createDynamicOcean(400);  // 半径 400m 覆盖 800m 海面
    scene.add(oceanMesh);
    statusEl.textContent = '加载 16 岛...';

    for (const it of ISLAND_LAYOUT) {
      const rad = it.a * Math.PI / 180;
      const m = await loadGLB(`assets/terrain/terrain_island_${it.id}.glb`);
      m.position.set(it.r * Math.cos(rad), 0, it.r * Math.sin(rad));
      m.rotation.y = rad + Math.PI/2;
      scene.add(m);
      // 每个岛沙滩边缘生成白色浪花环（动态起伏）
      scene.add(createFoamRing(it.r * Math.cos(rad), it.r * Math.sin(rad), 60));  // 岛直径约 120m，浪花环半径 60m
    }
    statusEl.textContent = '加载 9 矿...';

    for (const it of ORE_LAYOUT) {
      const m = await loadGLB(`assets/props/ore_${it.ore}.glb`);
      m.position.set(it.pos[0], 0, it.pos[2]);
      scene.add(m);
    }

    statusEl.textContent = '✅ 就绪：动态海面 + 16 岛（均匀分布）+ 9 矿 + 沙滩浪花';
    await new Promise(r => setTimeout(r, 1500));
  } catch (e) {
    statusEl.textContent = '❌ ' + e.message;
  }
}

// ============ 动态海面（Shader：顶点波浪 + 高光 + 泡沫渐变） ============
function createDynamicOcean(radius) {
  const geo = new THREE.PlaneGeometry(radius * 2, radius * 2, 128, 128);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uDeep: { value: new THREE.Color(0x1F6FA8) },   // 深海蓝（高饱和）
      uShallow: { value: new THREE.Color(0x4FA8D8) }, // 浅水
      uFoam: { value: new THREE.Color(0xE8F4FA) },   // 浪花白
      uLightDir: { value: new THREE.Vector3(0.5, 1, 0.3).normalize() },
    },
    vertexShader: `
      uniform float uTime;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying float vWave;
      void main() {
        vUv = uv;
        vec3 p = position;
        // 多层正弦波叠加（波浪起伏）
        float w1 = sin(p.x * 0.05 + uTime * 1.2) * cos(p.z * 0.04 + uTime * 0.9) * 0.6;
        float w2 = sin(p.x * 0.12 + uTime * 2.0) * 0.3;
        float w3 = cos(p.z * 0.1 - uTime * 1.6) * 0.25;
        float w = w1 + w2 + w3;
        vWave = w;
        p.y = w;
        vWorldPos = (modelMatrix * vec4(p, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uDeep;
      uniform vec3 uShallow;
      uniform vec3 uFoam;
      uniform vec3 uLightDir;
      uniform float uTime;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying float vWave;
      void main() {
        // 中心深、边缘浅（渐变）
        float d = length(vUv - 0.5) * 2.0;
        vec3 col = mix(uDeep, uShallow, smoothstep(0.3, 1.0, d));
        // 浪花白点（波峰处 + 时间漂移）
        float foam = smoothstep(0.5, 0.8, vWave + 0.3);
        // 波光高光（太阳方向）
        vec3 n = normalize(vec3(-sin(vWave*2.0), 1.0, -cos(vWave*1.5)));
        float spec = pow(max(dot(n, uLightDir), 0.0), 24.0);
        // 边缘泡沫线（模拟拍岸白沫，随时间漂）
        float edge = smoothstep(0.93, 1.0, d) * (0.6 + 0.4 * sin(uTime * 1.8));
        col = mix(col, uFoam, foam * 0.35);
        col += uFoam * spec * 0.55;
        col = mix(col, uFoam, edge * 0.7);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  // 注册到动画循环更新 uTime
  window.__oceanMat = mat;
  return mesh;
}

// ============ 沙滩浪花环（白色半透明，动态起伏） ============
function createFoamRing(x, z, baseRadius) {
  const group = new THREE.Group();
  group.position.set(x, 0.35, z);
  // 内圈（近沙滩，白色浓）
  const inner = new THREE.Mesh(
    new THREE.RingGeometry(baseRadius * 0.95, baseRadius * 1.05, 64),
    new THREE.MeshBasicMaterial({ color: 0xE8F4FA, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
  );
  inner.rotation.x = -Math.PI / 2;
  // 外圈（泡沫扩散，淡）
  const outer = new THREE.Mesh(
    new THREE.RingGeometry(baseRadius * 1.05, baseRadius * 1.15, 64),
    new THREE.MeshBasicMaterial({ color: 0xCFEAF8, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
  );
  outer.rotation.x = -Math.PI / 2;
  group.add(inner, outer);
  // 动画：上下起伏 + 透明度呼吸
  group.userData = { baseRadius, t: Math.random() * Math.PI * 2 };
  (window.__foamRings = window.__foamRings || []).push(group);
  return group;
}

let animTime = 0;
function animate() {
  requestAnimationFrame(animate);
  animTime += 0.016;
  // 海面波浪
  if (window.__oceanMat) window.__oceanMat.uniforms.uTime.value = animTime;
  // 浪花起伏
  if (window.__foamRings) {
    for (const ring of window.__foamRings) {
      ring.userData.t += 0.02;
      const wave = Math.sin(ring.userData.t) * 0.15;
      ring.position.y = 0.35 + wave;
      ring.children[0].material.opacity = 0.65 + Math.sin(ring.userData.t * 1.3) * 0.2;
      ring.children[1].material.opacity = 0.35 + Math.sin(ring.userData.t * 0.9 + 1) * 0.12;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
init();
</script>
</body>
</html>
